<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gente al Paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe3;--ink:#23201c;--muted:#7b7266;--panel:rgba(249,246,238,.94);--line:rgba(35,32,28,.16);--accent:#b8452c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Caveat",cursive;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block}
#ink{touch-action:none;cursor:crosshair}
.bar{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.title{font-size:30px;font-weight:700;line-height:1;margin-right:auto;padding:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px 10px 16px 9px}
.title small{font-size:17px;font-weight:500;color:var(--muted);margin-left:6px}
.group{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px 9px 13px 10px;padding:3px}
button{font:inherit;font-size:19px;line-height:1;border:0;background:transparent;color:var(--ink);padding:7px 10px;border-radius:9px;cursor:pointer;min-height:36px}
button:hover{background:rgba(35,32,28,.07)}
button.on{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.sl{display:flex;align-items:center;gap:6px;font-size:18px;padding:0 8px;color:var(--muted)}
input[type=range]{width:84px;accent-color:var(--ink)}
.foot{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;z-index:5}
#cap{font-size:21px;max-width:70ch;background:var(--panel);border:1px solid var(--line);border-radius:12px 9px 14px 8px;padding:6px 12px;opacity:0;transition:opacity .3s}
#cap.show{opacity:1}
#count{font-size:18px;color:var(--muted)}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(26px,5vw,44px);line-height:1.15;color:var(--muted);pointer-events:none;transition:opacity .6s;z-index:4;padding:0 16px;width:100%}
#hint small{display:block;font-size:.55em;margin-top:10px}
#tog{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none}
body.min .bar>*:not(#tog){display:none}
body.min #tog{display:block}
@media (max-width:640px){
 .title{display:none}
 .bar{gap:5px;left:8px;right:8px}
 .group{padding:2px}
 button{font-size:15px;padding:5px 6px;min-height:32px}
 input[type=range]{width:60px}
 label.sl{font-size:15px;padding:0 3px}
 #cap{font-size:17px}
}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efe9dd"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gente al paso"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"></head>
<body>
<canvas id="paper"></canvas>
<canvas id="ink"></canvas>

<div class="bar">
 <div class="title">Gente al paso <small>bocetos al azar</small></div>
 <div class="group" id="kinds" role="group" aria-label="Qué dibujar">
  <button data-k="personas" class="on">Cuerpo entero</button>
  <button data-k="caras">Caras</button>
  <button data-k="arboles">Árboles</button>
  <button data-k="plantas">Plantas</button>
  <button id="nat" title="Mezclar árboles y plantas cuando arrastrás gente">+ Naturaleza</button>
 </div>
 <div class="group" id="styles" role="group" aria-label="Estilo de dibujo">
  <button data-s="mezcla" class="on">Mezcla</button>
  <button data-s="tinta">Tinta</button>
  <button data-s="rotulador">Rotulador</button>
  <button data-s="acuarela">Acuarela</button>
  <button data-s="silueta">Silueta</button>
  <button data-s="grafito">Grafito</button>
 </div>
 <div class="group">
  <label class="sl" title="Altura de una persona de 1,70 m; todo se escala con eso">tamaño <input id="size" type="range" min="30" max="260" value="105"></label>
  <label class="sl" title="Distancia entre figuras al arrastrar">separación <input id="sep" type="range" min="0" max="100" value="22"></label>
 </div>
 <button id="tog" title="Mostrar controles">☰ Controles</button>
 <div class="group">
  <button id="hide" title="Ocultar controles para dibujar con toda la hoja">Ocultar</button>
  <button id="tags" title="Mostrar quién es cada persona">Etiquetas</button>
  <button id="undo" title="Deshacer (Ctrl+Z)">Deshacer</button>
  <button id="clear">Limpiar</button>
  <button id="save">Guardar PNG</button>
 </div>
</div>

<div id="hint">Tocá para dibujar una persona<small>mantené apretado y arrastrá para llenar de gente</small></div>

<div class="foot">
 <div id="cap"></div>
 <div id="count"></div>
</div>
