*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.g{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px 72px;text-align:center}
.g[hidden]{display:none}

.oculto{position:absolute;left:-9999px}
input{width:100%;height:52px;border-radius:999px;border:1px solid var(--borde);background:var(--campo);color:var(--ink);font-size:17px;text-align:center;letter-spacing:.08em;outline:none;-webkit-appearance:none;font-family:inherit}

button{height:52px;border:0;border-radius:999px;background:var(--azul);color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
button:active{opacity:.85}
.m{min-height:20px;margin-top:14px;font-size:14px;color:var(--error)}
.c{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}

/* métricas (GoatCounter): eventos de la pantalla de clave */
const gc=(p,t,n=0)=>{const g=window.goatcounter;if(g&&g.count){try{g.count({path:p,title:t,event:true});}catch(_){}}else if(n<20)setTimeout(()=>gc(p,t,n+1),500);};
const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function abrir(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin(D.iv)},key,bin(CT));
  const h=new TextDecoder().decode(pt);
  if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open();document.write(h);document.close();}
async function desdeClave(p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:bin(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);}
const g=document.getElementById("g"),m=document.getElementById("m"),k=document.getElementById("k");
(async()=>{let r=null;try{r=localStorage.getItem(K);}catch(_){}
  if(r){try{await abrir(await crypto.subtle.importKey("raw",bin(r),"AES-GCM",false,["decrypt"]));return;}
    catch(_){try{localStorage.removeItem(K);}catch(__){}}}
  g.hidden=false;k.focus();})();
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();m.textContent="Abriendo…";m.style.color="var(--mute)";
  try{const key=await desdeClave(k.value);await crypto.subtle.decrypt({name:"AES-GCM",iv:bin(D.iv)},key,bin(CT));
    gc("clave-correcta-radio-tape","Clave correcta: Radio Tape");
    try{localStorage.setItem(K,b64(await crypto.subtle.exportKey("raw",key)));}catch(_){}
    await abrir(key);}catch(_){gc("clave-incorrecta-radio-tape","Clave incorrecta: Radio Tape");m.style.color="";m.textContent="Clave incorrecta";k.select();}});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
