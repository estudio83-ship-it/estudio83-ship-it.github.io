<style>
html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:none;font-family:Helvetica,Arial,sans-serif}
#fondo{position:absolute;left:0;top:0;width:100%;height:100%;background:#111 url(fondo.jpg) center center no-repeat;-webkit-background-size:cover;background-size:cover}
#todo{position:absolute;left:50%;width:260px;margin-left:-130px}
.led{width:8px;height:8px;border-radius:4px;margin:0 auto 18px;background:#3a3a37;-webkit-transition:background .4s,-webkit-box-shadow .4s}
.led.on{background:#e2261c;-webkit-box-shadow:0 0 8px 2px rgba(226,38,28,.6),0 0 26px 8px rgba(226,38,28,.28)}
.led.on.noise{background:#f2f2ee;-webkit-box-shadow:0 0 8px 2px rgba(242,242,238,.6),0 0 26px 8px rgba(242,242,238,.28)}
.led.on.sleep{background:#a942e9;-webkit-box-shadow:0 0 8px 2px rgba(169,66,233,.6),0 0 26px 8px rgba(169,66,233,.28)}
.led.blink{-webkit-animation:titila .32s 2}
@-webkit-keyframes titila{50%{opacity:.15}}
#disco{position:relative;width:260px;height:260px;border-radius:130px;background:url(disco.png) 0 0 no-repeat;-webkit-background-size:260px 260px;background-size:260px 260px;-webkit-box-shadow:0 8px 21px rgba(0,0,0,.5);box-shadow:0 8px 21px rgba(0,0,0,.5)}
.lbl{position:absolute;left:0;width:260px;text-align:center;line-height:0}
#banda{top:36px;padding:6px 0}
#nombre{top:201px}
.lbl svg{display:inline-block}
.fl{position:absolute;top:110px;width:40px;height:40px}
.fl svg{position:absolute;left:10px;top:10px;width:20px;height:20px}
#ant{left:19px}
#sig{right:19px}
#centro{position:absolute;left:96px;top:96px;width:68px;height:68px;border-radius:34px}
#centro.press{background:rgba(0,0,0,.08)}
.fade{opacity:0}
.lbl{-webkit-transition:opacity .2s}
#msg{margin-top:22px;text-align:center;font-size:12px;color:#777;min-height:16px;padding:0 10px}
</style>
</head>

var b=0,pos=[0,3,0],on=false,noise=false,sleepEnd=0;
var radio=document.getElementById('radio'),ruido=document.getElementById('ruido'),led=document.getElementById('led'),
    nm=document.getElementById('nombre'),bd=document.getElementById('banda'),msg=document.getElementById('msg'),todo=document.getElementById('todo');
function cur(){return BANDS[b][1][pos[b]];}
function say(t){msg.innerHTML=t;}
function ubicar(){var h=window.innerHeight||480;todo.style.top=Math.max(0,Math.round((h-286)/2-10))+'px';}
function pintaLed(){led.className='led'+(on?' on':'')+(noise?' noise':'')+(sleepEnd?' sleep':'');}
function show(){
  var t=noise?'White Noise':cur()[0];
  nm.className='lbl fade';
  setTimeout(function(){nm.innerHTML=NOMBRE[t];bd.innerHTML=BANDA[BANDS[b][0]];nm.className='lbl';},180);
}
function reproducir(x){var r=x.play();if(r&&r.catch)r.catch(function(){});}
function pararRadio(){try{radio.pause();}catch(e){}radio.removeAttribute('src');try{radio.load();}catch(e){}}
function pararRuido(){try{ruido.pause();}catch(e){}}
function play(){
  pararRadio();pararRuido();
  if(noise){reproducir(ruido);say('');return;}
  radio.src=cur()[1];radio.load();reproducir(radio);say('Conectando…');
}
function power(v){
  if(v===undefined)v=!on;
  if(v===on)return;
  on=v;
  if(!on){sleepEnd=0;if(noise){noise=false;show();}pararRadio();pararRuido();say('');}
  else play();
  pintaLed();
}
function salirRuido(){if(noise){noise=false;}}
function step(d){salirRuido();var n=BANDS[b][1].length;pos[b]=(pos[b]+d+n)%n;show();if(on)play();pintaLed();}
function band(){salirRuido();b=(b+1)%BANDS.length;show();if(on)play();pintaLed();}
function toggleSleep(){if(sleepEnd){sleepEnd=0;}else{power(true);sleepEnd=new Date().getTime()+60*60000;}pintaLed();parpadea();}
function toggleNoise(){noise=!noise;show();if(on)play();else power(true);pintaLed();parpadea();}
function parpadea(){led.className=led.className.replace(' blink','');setTimeout(function(){led.className+=' blink';},10);setTimeout(pintaLed,700);}
setInterval(function(){if(sleepEnd&&new Date().getTime()>=sleepEnd)power(false);},5000);
radio.addEventListener('playing',function(){say('');},false);
radio.addEventListener('waiting',function(){if(on&&!noise)say('Conectando…');},false);
radio.addEventListener('error',function(){if(on&&!noise&&radio.getAttribute('src'))say('Esta emisora no anda en el iPod. Probá la siguiente.');},false);
/* toques: en el iPod uso touchstart/touchend (sin demora); en la compu, el mouse */
var tactil=('ontouchstart' in window);
function toque(el,fn){
  el.addEventListener(tactil?'touchend':'click',function(e){e.preventDefault();fn();},false);
}
toque(document.getElementById('sig'),function(){step(1);});
toque(document.getElementById('ant'),function(){step(-1);});
toque(bd,band);
(function(){
  var c=document.getElementById('centro'),t1=null,t3=null,armado=false,hecho=false;
  function abajo(e){if(e)e.preventDefault();armado=hecho=false;c.className='press';
    t1=setTimeout(function(){armado=true;},700);
    t3=setTimeout(function(){hecho=true;armado=false;c.className='';toggleNoise();},3000);}
  function arriba(e){if(e)e.preventDefault();clearTimeout(t1);clearTimeout(t3);c.className='';
    if(hecho)return; if(armado){toggleSleep();return;} power();}
  c.addEventListener(tactil?'touchstart':'mousedown',abajo,false);
  c.addEventListener(tactil?'touchend':'mouseup',arriba,false);
  if(tactil)c.addEventListener('touchcancel',function(){clearTimeout(t1);clearTimeout(t3);c.className='';},false);
})();
document.addEventListener('touchmove',function(e){e.preventDefault();},false);
window.addEventListener('resize',ubicar,false);
window.addEventListener('orientationchange',ubicar,false);
ubicar();show();pintaLed();
</script>
